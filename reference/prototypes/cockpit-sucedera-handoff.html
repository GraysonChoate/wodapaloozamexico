<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit → SUCEDERÁ — Beat 2 study</title>
<style>
:root{--p:0;--ink:#050505;--paper:#f2eee6}*{box-sizing:border-box}html,body{margin:0;background:var(--ink);font-family:Arial,Helvetica,sans-serif;color:var(--paper)}.journey{height:380svh}.stage{position:sticky;top:0;height:100svh;overflow:hidden;isolation:isolate;background:#000}.film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cockpit{z-index:1;opacity:calc(1 - var(--city)*1.1);transform:scale(calc(1 + var(--city)*.1))}.city{z-index:2;clip-path:inset(calc((1 - var(--city))*47%) calc((1 - var(--city))*7%));transform:scale(calc(.96 + var(--city)*.08));opacity:var(--city)}.shade{position:absolute;z-index:3;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.42));pointer-events:none}.ready{position:absolute;z-index:4;inset:0;display:grid;place-items:center;font-weight:900;font-size:clamp(58px,12vw,200px);line-height:.8;letter-spacing:-.09em;text-align:center;mix-blend-mode:screen;opacity:calc(1 - var(--ready)*1.4);transform:translateY(calc(var(--ready)*-18vh)) scale(calc(1 - var(--ready)*.2))}.word{position:absolute;z-index:5;left:0;right:0;top:50%;transform:translateY(-50%) scale(calc(.72 + var(--word)*.28));font-size:clamp(72px,15vw,255px);font-weight:950;letter-spacing:-.105em;line-height:.72;text-align:center;color:transparent;-webkit-text-stroke:1px rgba(242,238,230,.95);background-image:url('../../build/media/poster/b02_aerial.jpg');background-position:center;background-size:cover;background-clip:text;-webkit-background-clip:text;opacity:var(--word);white-space:nowrap}.rule{position:absolute;z-index:6;left:7vw;right:7vw;top:50%;height:1px;background:var(--paper);transform:scaleX(calc(1 - var(--word)));transform-origin:center}.label{position:absolute;z-index:7;left:6vw;bottom:7vh;font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:var(--word)}.place{position:absolute;z-index:7;right:6vw;bottom:7vh;text-align:right;font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:var(--word)}@media(max-width:700px){.word{font-size:16vw}.ready{font-size:19vw}.label{bottom:5vh}.place{bottom:5vh}}@media(prefers-reduced-motion:reduce){.journey{height:100svh}.cockpit{display:none}.city{clip-path:none;opacity:1;transform:none}.word,.label,.place{opacity:1}.ready,.rule{display:none}}
</style>
</head>
<body>
<main class="journey"><section class="stage" aria-label="Cockpit to Mexico City night arrival study">
  <video class="film cockpit" muted playsinline preload="auto" poster="../../build/media/poster/b01_cockpit.jpg"><source src="../../build/media/scrub/b01_cockpit.mp4" type="video/mp4"></video>
  <video class="film city" muted playsinline preload="auto" poster="../../build/media/poster/b02_aerial.jpg"><source src="../../build/media/scrub/b02_aerial.mp4" type="video/mp4"></video>
  <div class="shade"></div><div class="ready">ARE<br>YOU<br>READY?</div><div class="rule"></div><div class="word">SUCEDERÁ</div><div class="label">Mexico City / night arrival</div><div class="place">02 / the city</div>
</section></main>
<script>
const root=document.documentElement,clips=[...document.querySelectorAll('video')];let loaded=0;for(const clip of clips)clip.addEventListener('loadedmetadata',()=>{clip.pause();loaded++});const clamp=n=>Math.max(0,Math.min(1,n));function frame(){const max=document.documentElement.scrollHeight-innerHeight,p=clamp(scrollY/max),ready=clamp((p-.08)/.26),city=clamp((p-.26)/.42),word=clamp((p-.43)/.3);root.style.setProperty('--ready',ready);root.style.setProperty('--city',city);root.style.setProperty('--word',word);if(loaded===clips.length)clips.forEach((clip,i)=>clip.currentTime=Math.min(clip.duration-.04,clip.duration*clamp((p-(i? .22:0))/(i?.7:.45))));requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
</body>
</html>
