<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Qualifier Rail Motion — Wodapalooza Mexico</title>
<style>
  :root{--p:0;--paper:#f2ede2;--ink:#080808;--cyan:#08b8d9;--pink:#ea1e86}*{box-sizing:border-box}html{background:#050505}body{margin:0;background:#050505;color:var(--paper);font-family:Arial,Helvetica,sans-serif}.journey{height:430svh;position:relative}.sticky{position:sticky;top:0;height:100svh;overflow:hidden;background:#050505;isolation:isolate}.city{position:absolute;inset:0;background:url('../../build/media/poster/b02_aerial.jpg') 50% 50%/cover;opacity:calc(.2 + var(--p)*.8);transform:scale(calc(1.06 - var(--p)*.06));filter:contrast(1.06)}.city:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),transparent 30%,transparent 72%,rgba(0,0,0,.64))}.kicker{position:absolute;top:12%;left:6vw;z-index:3;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:calc(1 - min(1,var(--p)*3))}.rail-wrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transform:perspective(1100px) translate3d(calc((1 - var(--enter))*-118vw),calc((1 - var(--enter))*11vh),0) rotateZ(calc((1 - var(--enter))*-8deg)) rotateY(calc((1 - var(--enter))*-18deg));will-change:transform}.rail{width:min(1060px,90vw);min-height:180px;position:relative;display:grid;grid-template-columns:1.2fr .8fr .75fr auto;gap:clamp(14px,3vw,50px);align-items:center;padding:clamp(26px,4vw,48px) clamp(28px,5vw,70px);color:var(--ink);background:var(--paper) url('../authored-materials/v2/editorial-rail-field-02.png') 50% 50%/cover;border-top:1px solid rgba(0,0,0,.86);border-bottom:1px solid rgba(0,0,0,.86);box-shadow:0 24px 80px rgba(0,0,0,.48);pointer-events:auto;transform:scale(calc(.94 + var(--lock)*.06))}.rail:before,.rail:after{content:"";position:absolute;width:12px;height:12px;border:1px solid currentColor;opacity:.68}.rail:before{top:11px;left:11px}.rail:after{right:11px;bottom:11px}.label{font-size:clamp(21px,3vw,42px);line-height:.83;font-weight:900;letter-spacing:-.07em;text-transform:uppercase}.meta{font-size:10px;font-weight:800;letter-spacing:.16em;line-height:1.7;text-transform:uppercase}.cta{justify-self:end;display:inline-flex;gap:13px;align-items:center;color:var(--ink);text-decoration:none;font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid currentColor;padding:7px 0}.cta:after{content:"↗";font-size:19px;line-height:0}.instruction{position:absolute;left:6vw;bottom:8%;z-index:3;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:calc(1 - var(--exit))}.release{position:absolute;inset:0;background:#050505;opacity:var(--exit);mix-blend-mode:multiply;pointer-events:none}@media(max-width:700px){.rail{grid-template-columns:1fr auto;gap:18px;padding:30px 27px;min-height:0}.label{grid-column:1/-1;font-size:11vw}.meta{font-size:9px}.cta{font-size:9px}.city{background-position:58% 50%}}@media(prefers-reduced-motion:reduce){.journey{height:100svh}.rail-wrap{transform:none}.city{transform:none}.instruction{display:none}}
</style>
</head>
<body>
<main class="journey"><section class="sticky" aria-label="Online qualifier rail motion study">
  <div class="city" aria-hidden="true"></div><div class="kicker">01 / designed information place</div>
  <div class="rail-wrap"><div class="rail"><div class="label">Online<br>Qualifier</div><div class="meta">August 18–26<br>Mexico City</div><div class="meta">One entry point<br>One clear action</div><a class="cta" href="https://competitioncorner.net/events/21707/details" target="_blank" rel="noopener noreferrer">Enter</a></div></div>
  <div class="instruction">Film → registration rail → action → release</div><div class="release" aria-hidden="true"></div>
</section></main>
<script>
const root=document.documentElement;const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
function tick(){const max=document.documentElement.scrollHeight-innerHeight,p=clamp(scrollY/max);const enter=clamp(p/.29),lock=clamp((p-.22)/.18),exit=clamp((p-.72)/.22);root.style.setProperty('--p',p);root.style.setProperty('--enter',enter);root.style.setProperty('--lock',lock);root.style.setProperty('--exit',exit);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
</body>
</html>
