<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>December 04–06 — Date Motion Study</title>
<style>
:root{--p:0;--ink:#050505;--paper:#f2eee6}*{box-sizing:border-box}html,body{margin:0;background:var(--ink);font-family:Arial,Helvetica,sans-serif;color:var(--paper)}.journey{height:460svh}.stage{height:100svh;position:sticky;top:0;overflow:hidden;isolation:isolate;background:var(--ink)}.grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.18;background-image:radial-gradient(rgba(255,255,255,.18) .55px,transparent .7px);background-size:5px 5px}.city{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(calc(1.04 + var(--city)*.14));clip-path:inset(calc(var(--city)*42%) calc(var(--city)*12%));opacity:calc(1 - var(--city)*.88);filter:contrast(1.04);will-change:transform,clip-path,opacity}.shade{position:absolute;z-index:2;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.46),transparent 32%,transparent 68%,rgba(0,0,0,.5));opacity:calc(1 - var(--city)*.8)}.kicker,.edition{position:absolute;z-index:10;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.kicker{top:10vh;left:6vw}.edition{right:6vw;bottom:10vh;text-align:right;line-height:1.5;opacity:var(--date)}.axis{position:absolute;z-index:6;top:16vh;bottom:16vh;left:50%;width:1px;background:rgba(242,238,230,.7);transform:scaleY(var(--axis));transform-origin:center;opacity:calc(.15 + var(--axis)*.7)}.date{position:absolute;z-index:5;inset:0;pointer-events:none}.number{position:absolute;line-height:.68;font-weight:950;letter-spacing:-.12em;color:transparent;-webkit-text-stroke:1px rgba(242,238,230,.86);background:center/cover fixed no-repeat;background-clip:text;-webkit-background-clip:text;mix-blend-mode:screen;will-change:transform,opacity}.caption{position:absolute;font-size:clamp(11px,1vw,14px);font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity .12s linear}.n04{left:7vw;top:23vh;font-size:clamp(240px,40vw,700px);background-image:url('../../build/media/poster/b02_aerial.jpg');opacity:var(--date);transform:translateX(calc((1 - var(--date))*-42vw))}.c04{left:9vw;top:76vh;opacity:var(--date)}.n06{right:7vw;top:23vh;font-size:clamp(240px,40vw,700px);background-image:url('../../build/media/poster/b02_aerial.jpg');opacity:var(--date);transform:translateX(calc((1 - var(--date))*42vw))}.c06{right:10vw;top:76vh;text-align:right;opacity:var(--date)}.exit{position:absolute;z-index:20;inset:0;background:#000;opacity:var(--out);pointer-events:none}@media(max-width:700px){.kicker{top:8vh;left:6vw}.edition{right:6vw;bottom:8vh}.n04{left:3vw;top:29vh;font-size:61vw}.c04{left:7vw;top:68vh}.n06{right:3vw;top:29vh;font-size:61vw}.c06{right:7vw;top:68vh}.axis{top:22vh;bottom:24vh}}@media(prefers-reduced-motion:reduce){.journey{height:100svh}.city{transform:none;clip-path:none;opacity:1}.n04{opacity:1;transform:none}.n06,.axis,.edition{display:none}.c04{opacity:1}.exit{display:none}}
.n04{background-image:url('../../build/media/poster/b12_zocalo_empty.jpg')}.n06{background-image:url('../../build/media/poster/b12b_zocalo_full.jpg')}
</style>
</head>
<body>
<main class="journey"><section class="stage" aria-label="Date motion study: December fourth through sixth, twenty twenty-six">
  <video class="city" muted playsinline preload="auto" poster="../../build/media/poster/b12_zocalo_empty.jpg"><source src="../../build/media/scrub/b12_zocalo_empty.mp4" type="video/mp4" /></video><div class="shade" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><div class="axis" aria-hidden="true"></div>
  <div class="kicker">Wodapalooza Mexico City</div><div class="date"><div class="number n04">04</div><div class="caption c04">December 4</div><div class="number n06">06</div><div class="caption c06">December 6</div></div><div class="edition">December<br>2026</div><div class="exit" aria-hidden="true"></div>
</section></main>
<script>
const root=document.documentElement, city=document.querySelector('.city');let ready=false;city.addEventListener('loadedmetadata',()=>{ready=true;city.pause()});function clamp(n){return Math.max(0,Math.min(1,n))}function frame(){const max=document.documentElement.scrollHeight-innerHeight,p=clamp(scrollY/max),cityP=clamp((p-.08)/.26),date=clamp((p-.31)/.24),out=clamp((p-.94)/.06);root.style.setProperty('--p',p);root.style.setProperty('--city',cityP);root.style.setProperty('--date',date);root.style.setProperty('--axis',clamp((p-.24)/.36));root.style.setProperty('--out',out);if(ready)city.currentTime=Math.min(city.duration-.04,city.duration*clamp(p/.37));requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
</body>
</html>
