<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>16 / 3 / 1 — Proof Constellation</title>
<style>
  :root{--p:0;--ink:#070707;--paper:#f2eee6}*{box-sizing:border-box}html{background:var(--ink)}body{margin:0;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif}.journey{height:480svh}.stage{position:sticky;top:0;height:100svh;overflow:hidden;isolation:isolate;background:var(--ink)}.ground{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 58%,#222 0,#080808 61%,#000 100%)}.ground:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) .65px,transparent .7px);background-size:5px 5px;opacity:calc(.11 + var(--p)*.13);mix-blend-mode:screen}.eyebrow{position:absolute;z-index:9;top:10vh;left:5vw;font-size:10px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;opacity:calc(1 - clamp(0,(var(--p) - .76)*4,1))}.instruction{position:absolute;z-index:9;right:5vw;bottom:9vh;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;text-align:right;opacity:calc(1 - clamp(0,(var(--p) - .85)*5,1))}
  .fragment{position:absolute;overflow:hidden;background:#151515 center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.45);will-change:transform,opacity}.fragment:after{content:"";position:absolute;inset:0;border:1px solid rgba(245,240,232,.35);mix-blend-mode:screen}.f-city{width:34vw;height:27vw;max-height:53vh;left:calc(5vw + (var(--p))*4vw);top:calc(49vh - (var(--p))*17vh);background-image:url('../../build/media/poster/b02_aerial.jpg');transform:translateX(calc((1 - clamp(0,(var(--p) - .02)*2.7,1))*-49vw)) rotate(calc((1 - clamp(0,(var(--p) - .02)*2.7,1))*-10deg));opacity:clamp(0,(var(--p) - .02)*5,1)}.f-lift{width:21vw;height:31vw;max-height:60vh;right:calc(5vw + (var(--p))*5vw);top:calc(8vh + (var(--p))*18vh);background-image:url('../../build/media/poster/b05b_lift.jpg');transform:translateX(calc((1 - clamp(0,(var(--p) - .18)*3.1,1))*44vw)) rotate(calc((1 - clamp(0,(var(--p) - .18)*3.1,1))*8deg));opacity:clamp(0,(var(--p) - .18)*5,1)}.f-sticker{width:25vw;height:16vw;right:calc(29vw - (var(--p))*15vw);bottom:calc(2vh + (var(--p))*13vh);background-image:url('../../build/media/poster/b07_stickers.jpg');transform:translateY(calc((1 - clamp(0,(var(--p) - .39)*3.5,1))*36vh)) rotate(calc((1 - clamp(0,(var(--p) - .39)*3.5,1))*-6deg));opacity:clamp(0,(var(--p) - .39)*5,1)}.f-lock{width:19vw;height:24vw;left:calc(30vw - (var(--p))*9vw);bottom:calc(7vh + (var(--p))*11vh);background-image:url('../../build/media/poster/b09_lockout.jpg');transform:translateY(calc((1 - clamp(0,(var(--p) - .54)*4,1))*37vh)) rotate(calc((1 - clamp(0,(var(--p) - .54)*4,1))*5deg));opacity:clamp(0,(var(--p) - .54)*5,1)}
  .number{position:absolute;z-index:5;line-height:.69;font-weight:950;letter-spacing:-.105em;color:transparent;-webkit-text-stroke:1px rgba(242,238,230,.76);background:center/cover fixed no-repeat;background-clip:text;-webkit-background-clip:text;mix-blend-mode:screen;will-change:transform,opacity}.n16{left:4vw;top:18vh;font-size:clamp(170px,30vw,510px);background-image:url('../../build/media/poster/b02_aerial.jpg');transform:translateX(calc((1 - clamp(0,(var(--p) - .08)*2.5,1))*-64vw));opacity:clamp(0,(var(--p) - .08)*6,1)}.n3{right:7vw;top:36vh;font-size:clamp(190px,32vw,540px);background-image:url('../../build/media/poster/b05b_lift.jpg');transform:translateY(calc((1 - clamp(0,(var(--p) - .31)*2.9,1))*-74vh));opacity:clamp(0,(var(--p) - .31)*6,1)}.n1{left:42vw;bottom:3vh;font-size:clamp(250px,42vw,720px);background-image:url('../../build/media/poster/b07_stickers.jpg');transform:translateX(calc((1 - clamp(0,(var(--p) - .57)*3.2,1))*74vw));opacity:clamp(0,(var(--p) - .57)*6,1)}.fact{position:absolute;z-index:8;color:var(--paper);font-size:clamp(10px,1vw,13px);font-weight:800;letter-spacing:.18em;text-transform:uppercase;line-height:1.45;opacity:0;transform:translateY(16px);transition:opacity .1s linear,transform .1s linear}.fact.visible{opacity:1;transform:none}.fact16{left:7vw;top:68vh}.fact3{right:8vw;top:69vh;text-align:right}.fact1{left:48vw;bottom:12vh}.axis{position:absolute;z-index:7;width:1px;height:0;background:var(--paper);opacity:.7;left:50%;top:0;transform-origin:top;transform:scaleY(clamp(0,(var(--p) - .42)*2.3,1))}.release{position:absolute;z-index:10;inset:0;background:#000;opacity:clamp(0,(var(--p) - .9)*10,1);pointer-events:none}@media(max-width:700px){.f-city{width:65vw;height:54vw;top:53vh}.f-lift{width:44vw;height:64vw;right:1vw}.f-sticker{width:55vw;height:35vw;right:8vw}.f-lock{width:42vw;height:53vw;left:3vw}.n16{font-size:55vw;left:0;top:22vh}.n3{font-size:58vw;right:2vw;top:39vh}.n1{font-size:75vw;left:27vw;bottom:8vh}.fact16{left:6vw;top:71vh}.fact3{right:7vw;top:73vh}.fact1{left:39vw;bottom:16vh}.eyebrow{top:9vh}.instruction{display:none}}@media(prefers-reduced-motion:reduce){.journey{height:100svh}.fragment,.number{transform:none!important;opacity:1!important}.release{opacity:0!important}.fact{opacity:1;transform:none}.axis{transform:scaleY(1)}}
</style>
</head>
<body>
<main class="journey"><section class="stage" aria-label="Proof constellation motion study">
  <div class="ground" aria-hidden="true"></div><div class="eyebrow">Wodapalooza Mexico / proof of arrival</div>
  <div class="fragment f-city" aria-hidden="true"></div><div class="fragment f-lift" aria-hidden="true"></div><div class="fragment f-sticker" aria-hidden="true"></div><div class="fragment f-lock" aria-hidden="true"></div>
  <div class="number n16" aria-hidden="true">16</div><div class="number n3" aria-hidden="true">3</div><div class="number n1" aria-hidden="true">1</div><div class="axis" aria-hidden="true"></div>
  <div class="fact fact16">16 divisions</div><div class="fact fact3">Third city</div><div class="fact fact1">First edition</div><div class="instruction">Fragments / facts / one world</div><div class="release" aria-hidden="true"></div>
</section></main>
<script>
const root=document.documentElement, facts=[['.fact16',.22],['.fact3',.44],['.fact1',.67]];function frame(){const max=document.documentElement.scrollHeight-innerHeight,p=Math.max(0,Math.min(1,scrollY/max));root.style.setProperty('--p',p);facts.forEach(([s,n])=>document.querySelector(s).classList.toggle('visible',p>n));requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
</body>
