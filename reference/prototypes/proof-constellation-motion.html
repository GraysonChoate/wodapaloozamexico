<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>16 / 3 / 1 — Proof Motion Study</title>
<style>
:root{--p:0;--ink:#050505;--paper:#f2eee6}*{box-sizing:border-box}html,body{margin:0;background:var(--ink);font-family:Arial,Helvetica,sans-serif;color:var(--paper)}.journey{height:460svh}.stage{height:100svh;position:sticky;top:0;overflow:hidden;isolation:isolate;background:var(--ink)}.grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.18;background-image:radial-gradient(rgba(255,255,255,.18) .55px,transparent .7px);background-size:5px 5px}.city{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(calc(1.04 + var(--city)*.14));clip-path:inset(calc(var(--city)*42%) calc(var(--city)*12%));opacity:calc(1 - var(--city)*.88);filter:contrast(1.04);will-change:transform,clip-path,opacity}.shade{position:absolute;z-index:2;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.46),transparent 32%,transparent 68%,rgba(0,0,0,.5));opacity:calc(1 - var(--city)*.8)}.kicker,.step{position:absolute;z-index:10;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.kicker{top:10vh;left:6vw}.step{right:6vw;bottom:10vh;text-align:right;line-height:1.5}.axis{position:absolute;z-index:6;top:0;bottom:0;left:50%;width:1px;background:rgba(242,238,230,.7);transform:scaleY(var(--axis));transform-origin:center;opacity:calc(.15 + var(--axis)*.7)}.proof{position:absolute;z-index:5;inset:0;pointer-events:none}.number{position:absolute;line-height:.68;font-weight:950;letter-spacing:-.12em;color:transparent;-webkit-text-stroke:1px rgba(242,238,230,.86);background:center/cover fixed no-repeat;background-clip:text;-webkit-background-clip:text;mix-blend-mode:screen;will-change:transform,opacity}.caption{position:absolute;font-size:clamp(11px,1vw,14px);font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity .12s linear}.n16{left:7vw;top:22vh;font-size:clamp(210px,38vw,670px);background-image:url('../../build/media/poster/b02_aerial.jpg');opacity:var(--sixteen);transform:translateX(calc((1 - var(--sixteen))*-42vw))}.c16{left:9vw;top:76vh;opacity:var(--sixteen)}.n3{left:50%;top:14vh;font-size:clamp(300px,53vw,860px);background-image:url('../../build/media/poster/b05b_lift.jpg');opacity:var(--three);transform:translateX(calc(-50% + (1 - var(--three))*48vw))}.c3{left:50%;bottom:13vh;transform:translateX(-50%);opacity:var(--three)}.n1{right:9vw;top:19vh;font-size:clamp(280px,49vw,790px);background-image:url('../../build/media/poster/b07_stickers.jpg');opacity:var(--one);transform:translateX(calc((1 - var(--one))*45vw))}.c1{right:12vw;bottom:14vh;opacity:var(--one)}.exit{position:absolute;z-index:20;inset:0;background:#000;opacity:var(--out);pointer-events:none}@media(max-width:700px){.kicker{top:8vh;left:6vw}.step{right:6vw;bottom:8vh}.n16{left:3vw;top:26vh;font-size:62vw}.c16{left:7vw;top:68vh}.n3{top:20vh;font-size:82vw}.c3{bottom:20vh}.n1{right:2vw;top:24vh;font-size:78vw}.c1{right:7vw;bottom:20vh}}@media(prefers-reduced-motion:reduce){.journey{height:100svh}.city{transform:none;clip-path:none;opacity:1}.n16{opacity:1;transform:none}.n3,.n1,.axis,.step{display:none}.c16{opacity:1}.exit{display:none}}
</style>
</head>
<body>
<main class="journey"><section class="stage" aria-label="Proof motion study: sixteen divisions, third city, first edition">
  <video class="city" muted playsinline preload="auto" poster="../../build/media/poster/b02_aerial.jpg"><source src="media/mexico-city-timelapse-clean.mp4" type="video/mp4" /></video><div class="shade" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><div class="axis" aria-hidden="true"></div>
  <div class="kicker">Wodapalooza Mexico / proof of arrival</div><div class="proof"><div class="number n16">16</div><div class="caption c16">16 divisions</div><div class="number n3">3</div><div class="caption c3">Third city</div><div class="number n1">1</div><div class="caption c1">First edition</div></div><div class="step">One fact at a time<br>One field at a time</div><div class="exit" aria-hidden="true"></div>
</section></main>
<script>
const root=document.documentElement, city=document.querySelector('.city');let ready=false;city.addEventListener('loadedmetadata',()=>{ready=true;city.pause()});function clamp(n){return Math.max(0,Math.min(1,n))}function frame(){const max=document.documentElement.scrollHeight-innerHeight,p=clamp(scrollY/max),cityP=clamp((p-.08)/.26),sixteen=clamp((p-.31)/.16),three=clamp((p-.53)/.16),one=clamp((p-.75)/.15),out=clamp((p-.94)/.06);root.style.setProperty('--p',p);root.style.setProperty('--city',cityP);root.style.setProperty('--sixteen',sixteen);root.style.setProperty('--three',three);root.style.setProperty('--one',one);root.style.setProperty('--axis',clamp((p-.24)/.36));root.style.setProperty('--out',out);if(ready)city.currentTime=Math.min(city.duration-.04,city.duration*clamp(p/.37));requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
</body>
</html>
