<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ángel → cockpit — fold and breach study</title>
<style>
  :root{color-scheme:dark;--p:0;--fold:0;--cut:0;--release:0;--city:0;--flagIntro:1;--paper:0;--word:0;--ready:0;--readyClose:0;--sucede:0;--nav:0}
  *{box-sizing:border-box} body{margin:0;background:#050505;font-family:Arial,sans-serif}.journey{height:500svh}
  .stage{position:sticky;top:0;height:100svh;overflow:hidden;background:#050505;isolation:isolate}
  .flag-intro,.city,.cockpit{position:absolute;inset:0}.flag-intro{z-index:1;opacity:var(--flagIntro);overflow:hidden;will-change:opacity}.flag-intro video{filter:saturate(.88) contrast(1.05)}.city{z-index:2;opacity:var(--city)}
  video{width:100%;height:100%;object-fit:cover;display:block}.paper{position:absolute;inset:0;z-index:0;background:url('media/print/print-field-01.jpg') 50%/cover;opacity:var(--paper)}
  .fold{position:absolute;z-index:3;top:-7vh;bottom:-7vh;width:62vw;background:url('media/print/print-field-01.jpg') 50%/cover;will-change:transform}
  .fold:after{content:"";position:absolute;inset:0;background:rgba(8,8,8,.12)}
  .fold-left{left:-20vw;clip-path:polygon(0 0,73% 0,100% 100%,0 100%);transform-origin:left center;transform:translateX(calc(-58vw + var(--fold)*58vw - var(--release)*58vw)) rotateY(calc(-46deg + var(--fold)*46deg - var(--release)*46deg)) rotateZ(calc(-6deg + var(--fold)*6deg));box-shadow:20px 0 44px rgba(0,0,0,.48)}
  .fold-right{right:-20vw;clip-path:polygon(27% 0,100% 0,100% 100%,0 100%);transform-origin:right center;transform:translateX(calc(58vw - var(--fold)*58vw + var(--release)*58vw)) rotateY(calc(46deg - var(--fold)*46deg + var(--release)*46deg)) rotateZ(calc(6deg - var(--fold)*6deg));box-shadow:-20px 0 44px rgba(0,0,0,.48)}
  .fold-left:before,.fold-right:before{content:"";position:absolute;top:0;bottom:0;width:2px;background:#ece4d6;opacity:.7}.fold-left:before{right:25%}.fold-right:before{left:25%}
  .cockpit{z-index:2;opacity:var(--cut);clip-path:polygon(50% calc(50% - var(--cutSize)),calc(50% + var(--cutSize)) 50%,50% calc(50% + var(--cutSize)),calc(50% - var(--cutSize)) 50%);transform:scale(calc(.94 + var(--cut)*.06));will-change:clip-path,transform}
  .seam{position:absolute;z-index:4;left:50%;top:-10vh;width:1px;height:120vh;background:#f0e9dd;transform:translateX(-50%) rotate(-9deg);opacity:calc(var(--fold)*.75*(1 - var(--release)));mix-blend-mode:screen}
  .flag-title{position:absolute;z-index:5;inset:0;width:100%;height:100%;opacity:var(--word);transform:scale(calc(.92 + var(--word)*.08));pointer-events:none;overflow:visible}.flag-title video{width:100%;height:100%;object-fit:cover;filter:saturate(.95) contrast(1.05)}
  .ready-kinetic{position:absolute;z-index:6;inset:0;opacity:calc(var(--ready)*(1 - var(--readyClose)));pointer-events:none}.ready-kinetic span{position:absolute;display:block;color:transparent;background:url('media/poster/b01_cockpit.jpg') 50% 50%/cover;background-clip:text;-webkit-background-clip:text;-webkit-text-stroke:1px rgba(244,239,228,.52);font-weight:950;line-height:.72;letter-spacing:-.11em;white-space:nowrap;text-shadow:0 0 20px rgba(0,0,0,.72);mix-blend-mode:screen;will-change:transform}.ready-are{top:4vh;left:50%;font-size:clamp(72px,16vw,230px);transform:translate(-50%,calc((1 - var(--ready))*-42vh + var(--readyClose)*39vh)) scale(calc(1 - var(--readyClose)*.58))}.ready-you{top:35vh;left:50%;font-size:clamp(92px,22vw,320px);transform:translate(calc(-50% + (1 - var(--ready))*58vw),calc(var(--readyClose)*12vh)) scale(calc(1 - var(--readyClose)*.56))}.ready-word{bottom:6vh;left:50%;font-size:clamp(64px,15vw,220px);transform:translate(calc(-50% - (1 - var(--ready))*52vw),calc((1 - var(--ready))*25vh - var(--readyClose)*35vh)) scale(calc(1 - var(--readyClose)*.54))}
  .sucede-surface{position:absolute;z-index:7;inset:0;background:#050505;opacity:var(--sucede);pointer-events:none}.sucede-mask{position:absolute;z-index:8;inset:0;width:100%;height:100%;opacity:var(--sucede);transform:scale(calc(.92 + var(--sucede)*.08));pointer-events:none}.sucede-mask video{width:100%;height:100%;object-fit:cover;filter:contrast(1.05)}
  .kinetic-nav{position:absolute;z-index:9;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:70px;padding:0 24px;opacity:var(--nav);transform:translateY(calc((1 - var(--nav))*-18px));pointer-events:none;color:#f6f0e6;mix-blend-mode:difference}.kinetic-nav:after{content:"";position:absolute;bottom:0;left:24px;right:24px;height:1px;background:currentColor;opacity:.72}.kinetic-nav a,.kinetic-nav button{pointer-events:auto;color:inherit;background:none;border:0;padding:0;font:inherit;text-decoration:none;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.14em;cursor:pointer}.nav-menu{justify-self:start;display:flex;align-items:center;gap:10px}.nav-menu b{display:grid;place-items:center;width:27px;height:22px;border:1px solid currentColor;font-size:9px;letter-spacing:0}.nav-place{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}.nav-qualifier{justify-self:end;display:flex;gap:11px;align-items:center}.nav-qualifier:before{content:"";display:block;width:28px;height:1px;background:currentColor}
  @media(max-width:700px){.fold{width:78vw}.fold-left{left:-32vw}.fold-right{right:-32vw}.ready-are{font-size:25vw}.ready-you{font-size:32vw}.ready-word{font-size:22vw}.kinetic-nav{height:57px;padding:0 14px}.kinetic-nav:after{left:14px;right:14px}.nav-place{display:none}.nav-menu,.nav-qualifier{font-size:9px}.nav-qualifier:before{width:16px}.hint{display:none}}
  @media(prefers-reduced-motion:reduce){.journey{height:100svh}.fold,.seam{display:none}.paper{opacity:0!important}.city{display:none}.cockpit{opacity:1!important;clip-path:none!important;transform:none!important}}
</style>
</head>
<body>
<main class="journey" id="journey"><section class="stage" id="stage" style="--fold:0;--cut:0;--cutSize:0%;--release:0;--city:1;--paper:0">
  <div class="paper"></div>
  <div class="flag-intro"><video class="flag-intro-video" muted playsinline preload="auto" poster="media/poster/mexico-flag-title.jpg"><source src="media/scrub/mexico-flag-clean.mp4" type="video/mp4"></video></div>
  <div class="city"><video muted playsinline preload="auto" poster="media/poster/px_angel_pullback.jpg"><source src="media/scrub/px_angel_pullback.mp4" type="video/mp4"></video></div>
  <div class="cockpit"><video muted playsinline preload="auto" poster="media/poster/b01_cockpit.jpg"><source src="media/scrub/b01_cockpit.mp4" type="video/mp4"></video></div>
  <svg class="flag-title" viewBox="0 0 1600 900" role="img" aria-label="Wodapalooza Mexico City"><defs><clipPath id="flag-title-mask"><text x="800" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="176" font-weight="900" letter-spacing="-15">WODAPALOOZA</text><text x="800" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="154" font-weight="900" letter-spacing="-11">MEXICO CITY</text></clipPath></defs><foreignObject width="1600" height="900" clip-path="url(#flag-title-mask)"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1600px;height:900px"><video class="flag-title-video" muted playsinline preload="auto" poster="media/poster/mexico-flag-title.jpg"><source src="media/scrub/mexico-flag-clean.mp4" type="video/mp4" /></video></div></foreignObject></svg><div class="fold fold-left"></div><div class="fold fold-right"></div>
  <div class="ready-kinetic" aria-hidden="true"><span class="ready-are">ARE</span><span class="ready-you">YOU</span><span class="ready-word">READY?</span></div>
  <div class="sucede-surface"></div><svg class="sucede-mask" viewBox="0 0 1600 900" role="img" aria-label="Sucederá"><defs><clipPath id="sucede-mask"><text x="800" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="178" font-weight="900" letter-spacing="-14">SUCEDERÁ</text></clipPath></defs><foreignObject width="1600" height="900" clip-path="url(#sucede-mask)"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1600px;height:900px"><video class="sucede-video" muted playsinline preload="auto" poster="media/poster/px_angel_pullback.jpg"><source src="media/scrub/px_angel_pullback.mp4" type="video/mp4" /></video></div></foreignObject></svg>
  <nav class="kinetic-nav" aria-label="Site navigation"><button class="nav-menu" type="button" aria-label="Open site index"><b>W</b><span>Menu</span></button><span class="nav-place">01 / Arrival</span><a class="nav-qualifier" href="https://competitioncorner.net/events/21707/details" target="_blank" rel="noopener noreferrer">Qualifier ↗</a></nav>
  <div class="seam"></div>
</section></main>
<script>
  const stage=document.querySelector('#stage'),flagIntro=document.querySelector('.flag-intro-video'),flag=document.querySelector('.flag-title-video'),city=document.querySelector('.city video'),cockpit=document.querySelector('.cockpit video'),sucede=document.querySelector('.sucede-video'),place=document.querySelector('.nav-place');
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),seg=(p,a,b)=>clamp((p-a)/(b-a)),ease=t=>1-Math.pow(1-t,3);
  function state(){const r=journey.getBoundingClientRect(),p=clamp(-r.top/(r.height-innerHeight));
    const fold=ease(seg(p,.22,.47)),cut=ease(seg(p,.48,.68)),release=ease(seg(p,.68,.84));
    stage.style.setProperty('--fold',fold);stage.style.setProperty('--cut',cut);stage.style.setProperty('--cutSize',((cut*74)+(release*26))+'%');stage.style.setProperty('--release',release);
    const readyClose=ease(seg(p,.82,.94)),sucedeIn=ease(seg(p,.87,.97));
    stage.style.setProperty('--word',Math.min(ease(seg(p,.09,.19)),1-ease(seg(p,.34,.55))));stage.style.setProperty('--ready',ease(seg(p,.64,.73)));stage.style.setProperty('--readyClose',readyClose);stage.style.setProperty('--sucede',sucedeIn);stage.style.setProperty('--nav',ease(seg(p,.10,.22)));
    stage.style.setProperty('--flagIntro',1-ease(seg(p,.07,.16)));
    stage.style.setProperty('--paper',clamp((p-.18)*3.2,0,1));stage.style.setProperty('--city',ease(seg(p,.24,.49))*(1-ease(seg(p,.52,.63))));
    const f=Math.min(Math.max(.01,flag.duration||17)-.03,.1+p*(Math.max(.01,flag.duration||17)-.15));
    const a=Math.min(Math.max(.01,city.duration||17)-.03,.2+p*(Math.max(.01,city.duration||17)-.25));const b=Math.min(Math.max(.01,cockpit.duration||3)-.03,.04+p*(Math.max(.01,cockpit.duration||3)-.07));const s=Math.min(Math.max(.01,sucede.duration||17)-.03,9.5+sucedeIn*(Math.max(.01,sucede.duration||17)-9.55));
    place.textContent=sucedeIn>.22?'02 / SUCEDERÁ':'01 / ARRIVAL';
    if(Math.abs(flagIntro.currentTime-f)>.08)flagIntro.currentTime=f;if(Math.abs(flag.currentTime-f)>.08)flag.currentTime=f;if(Math.abs(city.currentTime-a)>.08)city.currentTime=a;if(Math.abs(cockpit.currentTime-b)>.08)cockpit.currentTime=b;if(Math.abs(sucede.currentTime-s)>.08)sucede.currentTime=s;
  }
  [flagIntro,flag,city,cockpit,sucede].forEach(v=>{v.addEventListener('loadeddata',()=>{v.pause();state()},{once:true});v.load()});addEventListener('scroll',state,{passive:true});addEventListener('resize',state);requestAnimationFrame(state);
</script>
</body></html>
