<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proof · Ángel pull-back — full bleed → framed print object → hold → release</title>
<meta name="robots" content="noindex">
<style>
  /* ═══════════════════════════════════════════════════════════════════════════
     FIRST PROOF — the move the film has never made.

     Every framed moment we have built so far EXPANDS: a contained thing becomes
     the world. Nothing has ever gone the other way. This is the collapse.

       full bleed  →  contracts into a wide framed editorial object  →  hold  →  release

     The mechanic that matters, and the one the ledger is explicit about: the
     page-owned print field is NOT faded in. It is already there, behind and
     outside the image, from the first frame. At full bleed the plate simply
     covers it. The contraction REVEALS it, geometrically. Nothing about the
     paper animates its own opacity — it is uncovered, the way a photograph
     being made smaller uncovers the page it was printed on.

     Second consequence, and the reason this is worth doing at all: the source is
     2.184:1 and the viewport is not. At full bleed `cover` crops the sides away.
     As the plate contracts to the source aspect, cover becomes contain and those
     sides come BACK. The picture does not just get smaller — it gets more
     complete. The recession down Reforma is widest at the moment the image is
     smallest, which is the argument.

     Type sits beside the centre, never over the statue. The Ángel's vertical
     axis is the composition; putting a word on it would be vandalism.
     ═══════════════════════════════════════════════════════════════════════════ */

  :root{
    --ink:#14110E;                 /* warm near-black — this section is printed, not lit */
    --ground:#000;
    --p:0;
    /* VISIBLE IS THE BASE STATE. With no JS there is no scrub and no timeline, so the
       page must resolve to the most meaningful still it can: the plate already contracted
       onto the paper with its type readable. JS overrides both of these on the first
       frame; if it never runs, this is what a reader gets, and it is not a broken page. */
    --c:1;                         /* contraction — 0 full bleed, 1 framed plate */
    --t:1;                         /* type presence */
  }
  *{ box-sizing:border-box }
  html{ background:#000 }
  body{
    margin:0; background:var(--ground); color:#fff;
    font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img,video{ display:block }

  /* ── the black either side ───────────────────────────────────────────────
     The full bleed needs somewhere to arrive from and somewhere to leave to. Without
     these the plate is simply the top of the document, and an arrival you never saw
     begin does not read as an arrival. */
  .rail{
    height:70svh; display:flex; align-items:center; justify-content:center;
    padding:0 24px; text-align:center;
  }
  .rail p{
    margin:0; max-width:44ch;
    font:700 11px/1.9 "JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
    letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.42);
  }
  .rail a{ color:rgba(255,255,255,.62) }

  /* ── the beat ────────────────────────────────────────────────────────────
     520svh buys the four movements room to be separate events rather than one
     continuous squeeze. The hold is 38% of that on its own — a pause a reader can
     actually stop inside is the entire point of a framed object. */
  .beat{ position:relative; height:520svh }
  .stage{ position:sticky; top:0; height:100svh; overflow:hidden; background:var(--ground) }

  /* the paper. Always present, never faded — occluded at full bleed, uncovered by the
     contraction. The only thing it does on its own is settle out of a very slight
     over-scale, so it reads as a sheet coming to rest rather than a static backdrop. */
  .ground{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:50% 50%;
    transform:scale(calc(1.05 - .05 * var(--c)));
  }

  /* the plate. Width and height interpolate independently between the viewport and the
     source aspect, which is what turns `cover` into `contain` across the move. */
  .frame{
    --pw:min(56vw, 980px);
    --ph:calc(var(--pw) / 2.1843);          /* the encode is 1280x586 */
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width: calc(100vw  + (var(--pw) - 100vw)  * var(--c));
    height:calc(100svh + (var(--ph) - 100svh) * var(--c));
    overflow:hidden; background:#000;
    /* A hairline, arriving only as the plate does. Neutral, no radius, no shadow, no
       gradient — the same restraint Beat 12 was approved with. A printed edge is a cut,
       not a bevel. */
    outline:1px solid rgba(20,17,14,calc(var(--c) * .55));
  }
  .plate{ position:absolute; inset:0 }
  .plate video,.plate img{ width:100%; height:100%; object-fit:cover; object-position:50% 50% }
  .plate video{ position:absolute; inset:0; z-index:0 }
  .plate img{ position:absolute; inset:0; z-index:1; transition:opacity .32s linear }
  .plate.ready img{ opacity:0 }

  /* ── type beside the centre ──────────────────────────────────────────────
     Anchored off the plate's own half-width so it tracks the frame instead of guessing
     at a margin. It appears after the contraction has committed and leaves before the
     release begins, so it is only ever on paper — it is never legibility-over-footage,
     which is why it needs none of the film's dark ground plates. */
  /* CAPTION, not margin notes. The first version put type in the left and right margins,
     which is where this particular paper is LOUDEST — the quiet zone in `print-field-01`
     is its centre, and the centre is exactly what the plate occupies. "El Ángel" landed on
     the cyan brush and the metadata landed on black ink; both measured as decoration rather
     than words. A plate on a page is captioned beneath itself, aligned to its own left edge,
     which is both legible and the correct editorial object. */
  .cap{
    position:absolute; z-index:4; opacity:var(--t); pointer-events:none;
    left:calc(50% - var(--pw)/2);
    top:calc(50% + var(--ph)/2 + 30px);
    max-width:var(--pw); color:var(--ink);
  }
  /* The film's local ground, inverted. Same five-stop falloff over an oversized box so the
     edge never becomes a visible lozenge — but paper-coloured, because here the type is dark
     on a light field rather than light on footage. Adding a selector to the established
     treatment beats inventing a second one. */
  .cap::before{
    content:""; position:absolute; inset:-18px -30px; z-index:-1;
    background:radial-gradient(ellipse 60% 150% at 50% 50%,
      rgba(238,234,226,.97) 0%, rgba(238,234,226,.93) 36%, rgba(238,234,226,.75) 56%,
      rgba(238,234,226,.44) 74%, rgba(238,234,226,.16) 88%, transparent 100%);
  }
  .cap p{ position:relative; z-index:1; margin:0 }
  .capname{
    font:800 clamp(22px,2.7vw,40px)/1.02 Archivo,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:-.025em;
  }
  .capmeta{
    margin-top:7px !important; color:rgba(20,17,14,.62);
    font:700 10px/1.8 "JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
    letter-spacing:.2em; text-transform:uppercase;
  }
  .frame,.cap{ --pw:min(60vw, 1040px); --ph:calc(var(--pw) / 2.1843) }

  @media (max-width:900px){
    .frame,.cap{ --pw:min(88vw, 560px) }
    .cap{ left:50%; transform:translateX(-50%); text-align:center; top:calc(50% + var(--ph)/2 + 24px) }
    .capmeta{ font-size:9px; letter-spacing:.16em }
  }

  /* ── safety nets ─────────────────────────────────────────────────────────
     Reduced motion gets the held state as a plain, still page. No sticky, no scrub, no
     interpolation — the plate at rest on the paper with its type, which is the frame this
     whole beat exists to arrive at. */
  @media (prefers-reduced-motion:reduce){
    .beat{ height:auto }
    .stage{ position:relative; height:auto; padding:8vh 0 }
    .ground{ transform:none }
    .frame{
      position:relative; left:auto; top:auto; transform:none; margin:0 auto;
      width:min(88vw,1120px); height:auto; aspect-ratio:1280/586;
    }
    .cap{
      position:relative; left:auto; top:auto; transform:none; opacity:1;
      margin:22px auto 0; max-width:min(88vw,1040px); text-align:center;
    }
    .cap::before{ display:none }
  }
</style>
</head>
<body>

<section class="rail">
  <p>First proof · full bleed → framed print object → hold → release<br>
     Other B-Roll recording 1 · 10.0–27.3s<br>
     <a href="index.html">← the film</a></p>
</section>

<section class="beat" id="pf" data-src="media/scrub/px_angel_pullback.mp4">
  <div class="stage">
    <img class="ground" src="media/print/print-field-01.jpg" alt="" aria-hidden="true">
    <div class="frame">
      <div class="plate">
        <video muted playsinline preload="auto" disablepictureinpicture></video>
        <img src="media/poster/px_angel_pullback.jpg"
             alt="El Ángel de la Independencia seen from above, Paseo de la Reforma receding behind it">
      </div>
    </div>
    <div class="cap">
      <p class="capname">El Ángel</p>
      <p class="capmeta">Paseo de la Reforma · Ciudad de México</p>
    </div>
  </div>
</section>

<section class="rail">
  <p>the frame releases · the city is handed back</p>
</section>

<script>
(() => {
  const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const b  = document.getElementById('pf');
  const v  = b.querySelector('.plate video');
  const plate = b.querySelector('.plate');
  const src = b.dataset.src;

  /* Same contract as the film: the resting position must equal the primed position, or the
     prime's seek is cancelled by the loop's seek to a frame the video already holds, no
     frame is ever presented, and the poster never lifts. */
  const HEAD = 0.04, TAIL = 0.05;
  const wantAt = p => HEAD + p * Math.max(0, (v.duration || 0) - HEAD - TAIL);

  let want = HEAD, seeking = false, revealed = false;
  const reveal = () => { if (revealed) return; revealed = true; plate.classList.add('ready'); };

  /* Arm AFTER .src is assigned — assigning src runs the media load algorithm and discards
     any pending rVFC. And arm both: the poster fully occludes the video, an occluded
     element is never asked to present a frame, so rVFC alone deadlocks. `seeked` breaks it. */
  const arm = () => {
    if ('requestVideoFrameCallback' in v) v.requestVideoFrameCallback(reveal);
    v.addEventListener('seeked', reveal, {once:true});
  };
  v.addEventListener('seeked', () => { seeking = false; });
  const begin = () => { arm(); seeking = true; try { v.currentTime = HEAD; } catch(e){} };
  v.addEventListener('loadedmetadata', begin, {once:true});
  let load = () => { v.src = src; if (v.readyState >= 1) begin(); };

  const clamp = t => t < 0 ? 0 : t > 1 ? 1 : t;
  const seg   = (x,a,b) => clamp((x - a) / (b - a));
  const ease  = t => 1 - Math.pow(1 - t, 3);

  function frame(){
    const H = innerHeight;
    const r = b.getBoundingClientRect();
    const travel = Math.max(1, r.height - H);
    const p = clamp(-r.top / travel);
    b.style.setProperty('--p', p.toFixed(4));

    if (load && r.top < H * 2.5) { load(); load = null; }

    /* The four movements. `c` is one value built from two opposing ramps rather than a
       three-stop keyframe list, so the hold is simply the stretch where the first has
       finished and the second has not started — it cannot drift out of sync with itself. */
    const inn = ease(seg(p, 0.10, 0.32));     // contract
    const out = ease(seg(p, 0.70, 0.92));     // release
    b.style.setProperty('--c', Math.max(0, inn - out).toFixed(4));

    /* Type lives strictly inside the hold, with room at both ends. It arrives after the
       plate has stopped moving and leaves before it starts again: copy that is still
       settling while the frame is settling reads as one more animated element instead of
       something printed. */
    const t = Math.min(seg(p, 0.28, 0.38), 1 - seg(p, 0.62, 0.70));
    b.style.setProperty('--t', t.toFixed(4));

    if (!RM) want = wantAt(p);
  }

  /* Position-derived, never event-derived. The scroll event does not fire at all in some
     embedded and automated contexts — the film had beats frozen at --p:0 through a full
     page of scrolling because of exactly this. */
  let lastY = -1;
  function tick(){
    if (scrollY !== lastY){ lastY = scrollY; frame(); }
    if (v && !RM && !seeking && v.duration && Math.abs(v.currentTime - want) > 1/48){
      seeking = true; v.currentTime = want;
    }
    document.hidden ? setTimeout(tick, 120) : requestAnimationFrame(tick);
  }
  tick();
  frame();
})();
</script>
</body>
</html>
